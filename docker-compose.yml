services:
  postgres:
    image: postgres:16-alpine
    container_name: sync_postgres
    restart: always
    environment:
      POSTGRES_USER: sync_user
      POSTGRES_PASSWORD: sync_password
      POSTGRES_DB: sync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sync_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
    depends_on:
      - postgres
    # Use the configured database/credentials, translating host-local addresses
    # for Docker Desktop. Never silently substitute another project's database.
    command:
      - node
      - -e
      - >-
        const url = new URL(process.env.DATABASE_URL);
        if (['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) url.hostname = 'host.docker.internal';
        process.env.DATABASE_URL = url.toString();
        require('./dist/src/server.js');
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    # The final Dockerfile stage is Nginx; development needs Node/Vite.
    build:
      context: ./frontend
      target: deps
    container_name: sync_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
